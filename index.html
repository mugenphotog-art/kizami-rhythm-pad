<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>KIZAMI Rhythm Pad</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="start" class="start"><button id="startbtn">Tap to start</button></div>

<header>
  <h1>KIZAMI <span>Pad</span></h1>
  <label>BPM<input id="bpm" type="number" inputmode="numeric" min="60" max="200" value="120"></label>
  <label>Bars<select id="bars"><option>1</option><option selected>2</option><option>4</option></select></label>
  <label class="chk"><input id="metro" type="checkbox" checked>Click</label>
  <label class="chk"><input id="quant" type="checkbox" checked>Snap to beat</label>
</header>

<main id="pads" aria-label="Pads"></main>

<footer>
  <div class="pos"><div id="posbar"></div></div>
  <div class="tr">
    <button id="rec" class="rec">● Rec</button>
    <button id="play">▶ Play</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
  </div>
  <div id="msg" class="msg"></div>
</footer>
<script src="app.js"></script>
</body>
</html>
